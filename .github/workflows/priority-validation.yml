name: Priority validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A burst of small evidence commits should leave one authoritative validation
# run per branch/PR.  Cancelling an obsolete run avoids stale failure emails
# while preserving the result for the newest commit.
concurrency:
  group: priority-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  focused:
    name: P0/P1 focused checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[api,test]"

      - name: Run focused priority validation
        id: priority_focus
        # The fast lane reports two independent outcomes: reproducible
        # software/evidence checks and the currently blocked external-science
        # screens.  Keep the report even when the latter is negative; the
        # next step fails the job only for an actual software/process failure.
        continue-on-error: true
        run: >-
          python scripts/run_priority_focus.py
          --priority critical
          --output artifacts/priority-focus.json

      - name: Fail only on software or process regression
        run: >-
          python -c "import json,sys; p=json.load(open('artifacts/priority-focus.json', encoding='utf-8')); s=p.get('software_checks',{}).get('status');
          sys.exit(0 if s == 'PASS' else 1)"

      - name: Publish priority report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: priority-validation-${{ github.run_number }}
          path: artifacts/priority-focus.json
          if-no-files-found: warn
          retention-days: 14
